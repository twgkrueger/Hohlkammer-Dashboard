name: Preise aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 6:17 Uhr (Sommerzeit) bzw. 5:17 Uhr (Winterzeit)
  workflow_dispatch:        # Knopf „Run workflow“ auf GitHub

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Preise abfragen
        run: python scraper/fetch_prices.py

      - name: Änderungen speichern
        run: |
          git config user.name "preis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Preise aktualisiert ($(TZ=Europe/Berlin date +%F))"
            git push
          fi
